services:
  postgres:
    image: postgres:16-alpine
    container_name: chatbot-voip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot
      POSTGRES_DB: chatbot_voip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chatbot-voip-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    container_name: chatbot-voip-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-sonnet-latest}
      DATABASE_URL: postgresql://chatbot:chatbot@postgres:5432/chatbot_voip
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: chatbot-voip-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  redis_data:
